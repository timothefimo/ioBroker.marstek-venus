<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Marstek Venus</title>
    <link rel="stylesheet" type="text/css" href="../../lib/css/adapter.css" />
    <script type="text/javascript" src="../../lib/js/jquery-bundle.js"></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>
    <script type="text/javascript" src="../../lib/js/translate.js"></script>
    <script type="text/javascript" src="../../lib/js/adapter-settings.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h3 { color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 4px; margin-top: 24px; }
        .row { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 14px; }
        input[type=text], input[type=number] {
            width: 400px; max-width: 100%;
            padding: 8px; border: 1px solid #ccc;
            border-radius: 4px; font-size: 14px;
        }
        .help { font-size: 12px; color: #888; margin-top: 3px; }
        .info { background:#e8f4fd; border-left:4px solid #1a73e8; padding:10px 14px; margin:20px 0; font-size:13px; line-height:1.6; }
        .btn-row { display:flex; gap:12px; margin-top:28px; padding-top:16px; border-top:1px solid #ddd; }
        .btn-save { background:#1a73e8; color:#fff; border:none; padding:10px 28px; border-radius:4px; font-size:14px; font-weight:bold; cursor:pointer; }
        .btn-save:hover { background:#1557b0; }
        .btn-cancel { background:#fff; color:#555; border:1px solid #bbb; padding:10px 28px; border-radius:4px; font-size:14px; cursor:pointer; }
        .btn-cancel:hover { background:#f5f5f5; }
    </style>
</head>
<body>
<div class="m adapter-container">

    <h3>Verbindung</h3>
    <div class="row">
        <label for="host">IP-Adresse des Marstek Venus</label>
        <input type="text" id="host" name="host" />
        <div class="help">Leer lassen für automatische Erkennung per UDP-Broadcast</div>
    </div>
    <div class="row">
        <label for="port">UDP-Port</label>
        <input type="number" id="port" name="port" />
        <div class="help">Standard: 30000</div>
    </div>

    <h3>Abfrage</h3>
    <div class="row">
        <label for="pollInterval">Abfrageintervall (Sekunden)</label>
        <input type="number" id="pollInterval" name="pollInterval" min="5" max="3600" />
        <div class="help">Minimum: 5 Sekunden</div>
    </div>
    <div class="row">
        <label for="passiveDuration">Passive Modus Dauer (Minuten)</label>
        <input type="number" id="passiveDuration" name="passiveDuration" min="1" max="1440" />
        <div class="help">Standard: 60 Minuten</div>
    </div>

    <div class="info">
        <b>Voraussetzung:</b> Aktiviere die Local API in der Marstek App unter
        Einstellungen → Local API (App-Version ≥ 1.6.51).
    </div>

    <div class="btn-row">
        <button class="btn-save" id="btn-save">💾 Speichern</button>
        <button class="btn-cancel" id="btn-cancel">✖ Abbrechen</button>
    </div>

</div>

<script type="text/javascript">
    function waitForSocket(cb) {
        if (typeof socket !== 'undefined' && socket && socket.connected) {
            cb();
        } else {
            setTimeout(function() { waitForSocket(cb); }, 200);
        }
    }

    function getInstance() {
        var m = window.location.search.match(/instance=([^&]+)/);
        if (m) return m[1];
        m = window.location.href.match(/marstek-venus\.(\d+)/);
        if (m) return 'marstek-venus.' + m[1];
        return 'marstek-venus.0';
    }

    function getEl(id) {
        return document.getElementById(id);
    }

    var instanceId = getInstance();

    function loadSettings() {
        waitForSocket(function() {
            socket.emit('getObject', 'system.adapter.' + instanceId, function(err, obj) {
                if (err || !obj) { console.error('Load error:', err); return; }
                var n = obj.native || {};
                getEl('host').value          = n.host !== undefined ? n.host : '';
                getEl('port').value          = n.port !== undefined ? n.port : 30000;
                getEl('pollInterval').value  = n.pollInterval !== undefined ? n.pollInterval : 30;
                getEl('passiveDuration').value = n.passiveDuration !== undefined ? n.passiveDuration : 60;
            });
        });
    }

    function saveSettings() {
        waitForSocket(function() {
            socket.emit('getObject', 'system.adapter.' + instanceId, function(err, obj) {
                if (err || !obj) { alert('Fehler beim Laden: ' + err); return; }
                obj.native = {
                    host:            getEl('host').value.trim(),
                    port:            parseInt(getEl('port').value) || 30000,
                    pollInterval:    Math.max(parseInt(getEl('pollInterval').value) || 30, 5),
                    passiveDuration: parseInt(getEl('passiveDuration').value) || 60
                };
                socket.emit('setObject', 'system.adapter.' + instanceId, obj, function(err2) {
                    if (err2) { alert('Speicherfehler: ' + err2); return; }
                    socket.emit('sendToHost', obj.common.host || 'pi', 'restartAdapter', instanceId, function() {
                        alert('✓ Gespeichert! Adapter wird neu gestartet.');
                    });
                });
            });
        });
    }

    // Warte bis DOM geladen ist - kein jQuery nötig
    document.addEventListener('DOMContentLoaded', function() {
        loadSettings();
        document.getElementById('btn-save').addEventListener('click', saveSettings);
        document.getElementById('btn-cancel').addEventListener('click', loadSettings);
    });

    // Dummy für adapter-settings.js
    function load(settings, onChange) {}
    function save(callback) { callback({}); }
</script>
</body>
</html>
